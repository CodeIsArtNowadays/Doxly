services:
  frontend:
    build: frontend/
    ports: 
       - "5174:5174"
    volumes:
       - ./frontend:/app
       - /app/node_modules
    
  app:
    build: backend/
    ports:
      - "8001:8000"
    env_file: backend/.env
    depends_on:
      - db

    environment:
      - UV_LINK_MODE=copy

  db: 
    image: pgvector/pgvector:pg16
    volumes:
       - postgres_data:/var/lib/postgresql/data
    env_file: backend/.env


volumes:
  postgres_data:
       